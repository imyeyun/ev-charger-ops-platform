spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://<HOST>:3306/<DBNAME>?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: <USER>
    password: <PASSWORD>
    # DB 실제 생성후 맞는 유저, 패스워드 입력

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
